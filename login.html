<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Quiz Littéraire</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 40px;
            max-width: 1000px;
            width: 100%;
        }

        .form-section {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }

        .form-section h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .toggle-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }

        .hidden {
            display: none !important;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 32px;
            margin-bottom: 10px;
        }

        .logo p {
            color: #999;
            font-size: 14px;
        }

        .info-section {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            color: white;
        }

        .info-section h1 {
            font-size: 40px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .info-section p {
            font-size: 16px;
            line-height: 1.6;
            opacity: 0.95;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                gap: 20px;
            }

            .form-section {
                padding: 30px;
            }

            .info-section {
                display: none;
            }

            .info-section h1 {
                font-size: 28px;
            }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-section">
            <h1>Quiz Littéraire</h1>
            <p>Testez vos connaissances sur les plus grands auteurs et livres de la littérature française et mondiale.</p>
        </div>

        <div class="form-section">
            <!-- Formulaire de connexion -->
            <div id="login-form" class="form-container">
                <div class="logo">
                    <h1>📚</h1>
                </div>
                <h2>Connexion</h2>
                <div class="error-message" id="login-error"></div>
                <div class="success-message" id="login-success"></div>
                <div class="loading" id="login-loading">
                    <div class="spinner"></div>
                    Connexion en cours...
                </div>

                <form id="login-form-element" style="display: block;">
                    <div class="form-group">
                        <label for="login-username">Login</label>
                        <input type="text" id="login-username" placeholder="Entrez votre login" required>
                    </div>
                    <div class="form-group">
                        <label for="login-password">Mot de passe</label>
                        <input type="password" id="login-password" placeholder="Entrez votre mot de passe" required>
                    </div>
                    <button type="submit">Se connecter</button>
                </form>

                <div class="toggle-link">
                    Pas encore inscrit ? <a onclick="toggleForms()">S'inscrire</a>
                </div>
            </div>

            <!-- Formulaire d'inscription -->
            <div id="signup-form" class="form-container hidden">
                <div class="logo">
                    <h1>✨</h1>
                </div>
                <h2>Inscription</h2>
                <div class="error-message" id="signup-error"></div>
                <div class="success-message" id="signup-success"></div>
                <div class="loading" id="signup-loading">
                    <div class="spinner"></div>
                    Inscription en cours...
                </div>

                <form id="signup-form-element" style="display: block;">
                    <div class="form-group">
                        <label for="signup-nom">Nom</label>
                        <input type="text" id="signup-nom" placeholder="Votre nom" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-prenom">Prénom</label>
                        <input type="text" id="signup-prenom" placeholder="Votre prénom" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-email">Email</label>
                        <input type="email" id="signup-email" placeholder="Votre adresse email" required>
                    </div>
                    <div class="form-group">
                        <label for="signup-login">Login</label>
                        <input type="text" id="signup-login" placeholder="Choisir un login" required>
                    </div>
                    <button type="submit">S'inscrire</button>
                </form>

                <div class="toggle-link">
                    Déjà inscrit ? <a onclick="toggleForms()">Se connecter</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleForms() {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            
            loginForm.classList.toggle('hidden');
            signupForm.classList.toggle('hidden');
            
            // Réinitialiser les messages
            document.getElementById('login-error').style.display = 'none';
            document.getElementById('signup-error').style.display = 'none';
            document.getElementById('login-success').style.display = 'none';
            document.getElementById('signup-success').style.display = 'none';
        }

        // Gestion du formulaire de connexion
        document.getElementById('login-form-element').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            
            const errorDiv = document.getElementById('login-error');
            const loadingDiv = document.getElementById('login-loading');
            
            errorDiv.style.display = 'none';
            loadingDiv.classList.add('active');
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        login: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    // Vérifier si l'utilisateur est admin
                    if (data.user.is_admin) {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/home.html';
                    }
                } else {
                    errorDiv.textContent = data.message || 'Erreur de connexion';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Erreur de connexion au serveur';
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.classList.remove('active');
            }
        });

        // Gestion du formulaire d'inscription
        document.getElementById('signup-form-element').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nom = document.getElementById('signup-nom').value;
            const prenom = document.getElementById('signup-prenom').value;
            const email = document.getElementById('signup-email').value;
            const login = document.getElementById('signup-login').value;
            
            const errorDiv = document.getElementById('signup-error');
            const successDiv = document.getElementById('signup-success');
            const loadingDiv = document.getElementById('signup-loading');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            loadingDiv.classList.add('active');
            
            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nom: nom,
                        prenom: prenom,
                        email: email,
                        login: login
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    successDiv.textContent = data.message;
                    successDiv.style.display = 'block';
                    
                    // Réinitialiser le formulaire
                    document.getElementById('signup-form-element').reset();
                    
                    // Afficher un message après 3 secondes et retourner à la connexion
                    setTimeout(() => {
                        toggleForms();
                    }, 3000);
                } else {
                    errorDiv.textContent = data.message || 'Erreur lors de l\'inscription';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                errorDiv.textContent = 'Erreur de connexion au serveur';
                errorDiv.style.display = 'block';
            } finally {
                loadingDiv.classList.remove('active');
            }
        });

        // Vérifier si l'utilisateur est déjà connecté
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const user = await response.json();
                    if (user.is_admin) {
                        window.location.href = '/admin.html';
                    } else {
                        window.location.href = '/home.html';
                    }
                }
            } catch (error) {
                // Pas connecté, c'est normal sur la page de login
            }
        });
    </script>
</body>
</html>
