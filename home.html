<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque de Quiz</title>
    <style>
        :root {
            --romain-red: #8b0000;
            --gold: #d4af37;
            --parchment: #fdf5e6;
            --dark: #2c2c2c;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background-color: var(--dark);
            color: #333;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 50px;
            padding: 30px 0;
            border-bottom: 4px solid var(--gold);
        }
        
        .header h1 {
            color: var(--parchment);
            font-size: 3em;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
            margin-bottom: 10px;
        }
        
        .header p {
            color: var(--gold);
            font-size: 1.2em;
            font-style: italic;
        }
        
        .books-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
            margin-bottom: 50px;
        }
        
        .book-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: row;
            height: 350px;
        }
        
        .book-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.4);
        }
        
        .book-cover {
            width: 250px;
            height: 350px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.3em;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, var(--romain-red), var(--gold));
            order: 2;
        }
        
        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .book-cover::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.1);
            z-index: 1;
        }
        
        .status-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9em;
            font-weight: bold;
            z-index: 10;
        }
        
        .status-badge.completed {
            background: #4CAF50;
            color: white;
        }
        
        .status-badge.in-progress {
            background: #FF9800;
            color: white;
        }
        
        .status-badge.not-started {
            background: #9E9E9E;
            color: white;
        }
        
        .book-info {
            padding: 25px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            order: 1;
        }
        
        .book-title {
            font-size: 1.5em;
            color: var(--romain-red);
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .book-author {
            color: #888;
            font-size: 0.95em;
            margin-bottom: 12px;
            font-style: italic;
        }
        
        .book-description {
            color: #555;
            font-size: 0.95em;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        
        .progress-section {
            margin: 15px 0;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #666;
        }
        
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--romain-red), var(--gold));
            transition: width 0.3s ease;
        }
        
        .btn-start {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--romain-red);
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
        }
        
        .btn-start:hover {
            background: #a00;
        }
        
        .btn-continue {
            background: var(--gold);
            color: var(--romain-red);
        }
        
        .btn-continue:hover {
            background: #e6c200;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--parchment);
        }
        
        .empty-state h2 {
            font-size: 2em;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 1.5em;
            color: var(--gold);
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--gold);
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--parchment);
            font-size: 1.2em;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 15px 30px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }

        .navbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .navbar-title {
            color: #8b0000;
            font-size: 16px;
            font-weight: 600;
        }

        .navbar-right {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-info {
            color: #666;
            font-size: 14px;
        }

        .navbar-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        .navbar-link:hover {
            color: #764ba2;
        }

        .logout-btn {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #ee5a52;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <div class="navbar-left">
            <div class="navbar-title">📚 Quiz Littéraire</div>
        </div>
        <div class="navbar-right">
            <div class="user-info" id="user-name"></div>
            <a href="/settings.html" class="navbar-link">⚙️ Paramètres</a>
            <button class="logout-btn" onclick="logout()">Déconnexion</button>
        </div>
    </div>

    <div class="header">
        <h1>📚 Bibliothèque de Quiz</h1>
        <p>Explorez des histoires captivantes à travers des quiz interactifs</p>
    </div>
    
    <div id="in-progress-section"></div>
    <div id="completed-section"></div>
    <div id="loading" class="loading">Chargement de la bibliothèque...</div>
</div>

<script>
    let currentUser = null;

    async function loadBooks() {
        try {
            const response = await fetch('/api/books');
            if (!response.ok) {
                if (response.status === 401) {
                    window.location.href = '/login.html';
                    return;
                }
                throw new Error('Erreur lors du chargement');
            }
            
            const data = await response.json();
            
            const inProgressBooks = data.books.filter(b => b.in_progress && !b.is_completed);
            const completedBooks = data.books.filter(b => b.is_completed);
            const notStartedBooks = data.books.filter(b => !b.in_progress && !b.is_completed);
            
            document.getElementById('loading').style.display = 'none';
            
            renderSection('En cours...', inProgressBooks, 'in-progress-section');
            renderSection('Terminés', completedBooks, 'completed-section');
            renderSection('Non commencés', notStartedBooks, 'not-started-section');
            
        } catch (error) {
            console.error('Erreur:', error);
            document.getElementById('loading').innerHTML = '<p>Erreur lors du chargement de la bibliothèque</p>';
        }
    }
    
    function renderSection(title, books, elementId) {
        const container = document.getElementById(elementId);
        
        if (books.length === 0) {
            container.innerHTML = '';
            return;
        }
        
        let html = `<h2 class="section-title">${title}</h2><div class="books-grid">`;
        
        books.forEach(book => {
            const progressPercent = Math.round((book.completed_chapters / book.total_chapters) * 100);
            const statusClass = book.is_completed ? 'completed' : book.in_progress ? 'in-progress' : 'not-started';
            const statusText = book.is_completed ? '✅ Terminé' : book.in_progress ? '🔄 En cours' : '▶ Commencer';
            const btnClass = book.in_progress ? 'btn-continue' : '';
            
            html += `
                <div class="book-card" onclick="openQuiz('${book.id}')">
                    <div class="book-cover">
                        ${book.cover ? `<img src="${book.cover}" alt="${book.title}">` : book.title}
                        <div class="status-badge ${statusClass}">${statusText}</div>
                    </div>
                    <div class="book-info">
                        <div class="book-title">${book.title}</div>
                        <div class="book-author">par ${book.author}</div>
                        <div class="book-description">${book.description}</div>
                        <div class="progress-section">
                            <div class="progress-label">
                                <span>Progression</span>
                                <span>${book.completed_chapters}/${book.total_chapters}</span>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                        <button class="btn-start ${btnClass}">${book.is_completed ? 'Revoir le quiz' : 'Accéder au quiz'}</button>
                    </div>
                </div>
            `;
        });
        
        html += '</div>';
        container.innerHTML = html;
    }
    
    function openQuiz(bookId) {
        window.location.href = `/quiz.html?book=${bookId}`;
    }

    async function logout() {
        try {
            await fetch('/api/logout');
            window.location.href = '/login.html';
        } catch (error) {
            window.location.href = '/login.html';
        }
    }
    
    // Charger les infos utilisateur et les livres au démarrage
    window.addEventListener('load', async () => {
        try {
            const response = await fetch('/api/user');
            if (response.ok) {
                currentUser = await response.json();
                document.getElementById('user-name').textContent = `👤 ${currentUser.prenom} ${currentUser.nom}`;
                loadBooks();
            } else {
                window.location.href = '/login.html';
            }
        } catch (error) {
            window.location.href = '/login.html';
        }
    });
</script>

</body>
</html>
