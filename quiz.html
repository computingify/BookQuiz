<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Quiz Interactif</title>
    <style>
        /* [Tes styles CSS que tu as fournis précédemment, ils sont superbes] */
        /* ... copier-coller tes styles ici ... */
    </style>
</head>
<body>
<div class="paper">
    <h1 id="book-title">Quiz</h1>
    <div class="nav-box">
        <select id="chapSelect" onchange="switchChapter()"></select>
        <button onclick="location.href='home.html'">🏠 Retour</button>
    </div>
    <div id="quiz-zone"></div>
    <div id="result-zone" class="result-screen">
        <div id="score-text" class="score-display"></div>
        <div id="correction-details"></div>
        <button onclick="switchChapter()" class="btn-retry">Continuer</button>
    </div>
</div>

<script>
    let quizData = null;
    const urlParams = new URLSearchParams(window.location.search);
    const currentBookId = urlParams.get('book');
    const currentUser = urlParams.get('user') || 'Guest';
    let currentChap = 1;

    async function loadQuiz() {
        const resp = await fetch(`/api/quiz/${currentBookId}`);
        quizData = await resp.json();
        document.getElementById('book-title').textContent = quizData.title;
        
        const select = document.getElementById('chapSelect');
        quizData.chapters.forEach(c => {
            select.innerHTML += `<option value="${c.id}">${c.title}</option>`;
        });

        updateMenuProgress();
    }

    async function updateMenuProgress() {
        const resp = await fetch(`/api/status/${currentBookId}?user=${encodeURIComponent(currentUser)}`);
        const status = await resp.json();
        const select = document.getElementById('chapSelect');
        
        let nextToPlay = null;
        Array.from(select.options).forEach(opt => {
            const chap = quizData.chapters.find(c => c.id == opt.value);
            if (status.chapters.includes(chap.title)) {
                opt.text = "✅ " + chap.title;
            } else if (!nextToPlay) {
                nextToPlay = opt.value;
            }
        });
        
        if (nextToPlay) {
            select.value = nextToPlay;
            renderQuiz(nextToPlay);
        }
    }

    function renderQuiz(id) {
        currentChap = id;
        const chap = quizData.chapters.find(c => c.id == id);
        let html = `<h2>${chap.title}</h2>`;
        chap.questions.forEach((q, i) => {
            html += `<div class="question-block">
                <p>${i+1}. ${q.q}</p>
                ${q.options.map((opt, j) => `<label><input type="radio" name="q${i}" value="${j}"> ${opt}</label><br>`).join('')}
            </div>`;
        });
        html += `<button class="validate" onclick="submitQuiz()">Valider</button>`;
        document.getElementById('quiz-zone').innerHTML = html;
        document.getElementById('quiz-zone').style.display = 'block';
        document.getElementById('result-zone').style.display = 'none';
    }

    async function submitQuiz() {
        const chap = quizData.chapters.find(c => c.id == currentChap);
        let score = 0;
        
        chap.questions.forEach((q, i) => {
            const sel = document.querySelector(`input[name="q${i}"]:checked`);
            if (sel && parseInt(sel.value) === q.r) score++;
        });

        // Envoi SQL
        const body = new URLSearchParams();
        body.append('username', currentUser);
        body.append('book_id', currentBookId);
        body.append('chapitre', chap.title);
        body.append('score', score);

        await fetch('/api/log-result', { method: 'POST', body });

        document.getElementById('quiz-zone').style.display = 'none';
        document.getElementById('result-zone').style.display = 'block';
        document.getElementById('score-text').textContent = `${score} / 5`;
        
        updateMenuProgress();
    }

    function switchChapter() {
        renderQuiz(document.getElementById('chapSelect').value);
    }

    window.onload = loadQuiz;
</script>
</body>
</html>
